# Local development infrastructure for the drun-dash control plane.
#
# Provides PostgreSQL (persistent state) and Redis (budget counters /
# session cache). No application container yet — application services are
# added in batch 2.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Docker Compose v2 format (the top-level `version` key is obsolete in v2).

services:
  postgres:
    image: postgres:16
    container_name: drundash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drundash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drundash}
      POSTGRES_DB: ${POSTGRES_DB:-drundash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Scope the check to the configured user/db so it passes only when
      # the intended database is actually ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drundash} -d ${POSTGRES_DB:-drundash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: drundash-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
