# Full-stack drun-dash platform: Postgres + Redis + one-shot migrations, then
# the three service containers (control-plane, llm-proxy, admin-ui).
#
# This is the *application* stack. The infrastructure-only dev stack in
# docker-compose.yml (just Postgres + Redis) is left untouched; use this file
# when you want the whole platform up with one command:
#
#   cp .env.app.example .env.app
#   docker compose --env-file .env.app -f docker-compose.app.yml up --build
#
# Every value below has a sensible dev default via ${VAR:-default}, so
# `docker compose -f docker-compose.app.yml config` parses even with no env
# file. Copy .env.app.example to override credentials and wire real secrets.
#
# Startup order is enforced with healthchecks + depends_on:
#   postgres/redis (healthy) -> migrate (runs once, exits 0)
#     -> control-plane (healthy) -> admin-ui
#     -> llm-proxy
#
# Docker Compose v2 format (the top-level `version` key is obsolete in v2).

services:
  # ---- infrastructure ---------------------------------------------------
  postgres:
    image: postgres:16
    container_name: drundash-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drundash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drundash}
      POSTGRES_DB: ${POSTGRES_DB:-drundash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drundash} -d ${POSTGRES_DB:-drundash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: drundash-app-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---- one-shot schema migration ---------------------------------------
  # Runs golang-migrate against Postgres once, then exits 0. The app services
  # wait on `service_completed_successfully` so they never see a half-migrated
  # schema. Image version pinned to the module's golang-migrate (v4.18.1).
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: drundash-app-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations:ro
    # ${DATABASE_URL} is interpolated by compose at parse time, so the fully
    # resolved connection string is baked into the command (no shell needed).
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:-postgres://drundash:drundash@postgres:5432/drundash?sslmode=disable}"
      - "up"

  # ---- application services ---------------------------------------------
  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    image: drundash-control-plane:latest
    container_name: drundash-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Shared config (internal/config).
      DATABASE_URL: ${DATABASE_URL:-postgres://drundash:drundash@postgres:5432/drundash?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      # Auth / JWT (read directly from env by the control-plane wiring).
      CP_JWT_ISSUER: ${CP_JWT_ISSUER:-drun-dash}
      CP_JWT_AUDIENCE: ${CP_JWT_AUDIENCE:-drun-dash-api}
      CP_JWT_KID: ${CP_JWT_KID:-dev}
      CP_ACCESS_TOKEN_TTL: ${CP_ACCESS_TOKEN_TTL:-15m}
      CP_JWT_SIGNING_SEED: ${CP_JWT_SIGNING_SEED:-}
      CP_OIDC_ISSUER: ${CP_OIDC_ISSUER:-}
      CP_OIDC_CLIENT_ID: ${CP_OIDC_CLIENT_ID:-}
      # Session launch (ADR-0003).
      CP_BUNDLE_SIGNING_SEED: ${CP_BUNDLE_SIGNING_SEED:-}
      CP_BUNDLE_SIGNING_KID: ${CP_BUNDLE_SIGNING_KID:-dev}
      CP_PROXY_BASE_URL: ${CP_PROXY_BASE_URL:-http://llm-proxy:8081}
      CP_SESSION_TTL: ${CP_SESSION_TTL:-60m}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      # /readyz returns 200 only once the DB ping succeeds (migrations done).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  llm-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.llm-proxy
    image: drundash-llm-proxy:latest
    container_name: drundash-llm-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://drundash:drundash@postgres:5432/drundash?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PROXY_HTTP_ADDR: ${PROXY_HTTP_ADDR:-:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      # Upstream provider + master credential (see internal/proxy README).
      LLM_UPSTREAM_BASE_URL: ${LLM_UPSTREAM_BASE_URL:-https://api.openai.com}
      # Dev EnvVault backend: vault://dev/anthropic -> DRUNDASH_SECRET_ANTHROPIC.
      DRUNDASH_SECRET_ANTHROPIC: ${DRUNDASH_SECRET_ANTHROPIC:-}
    ports:
      - "${PROXY_HTTP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin-ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.admin-ui
    image: drundash-admin-ui:latest
    container_name: drundash-admin-ui
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      # config.Load still validates these even though admin-ui never dials
      # them; the defaults are valid URLs, so validation passes.
      DATABASE_URL: ${DATABASE_URL:-postgres://drundash:drundash@postgres:5432/drundash?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      ADMIN_UI_HTTP_ADDR: ${ADMIN_UI_HTTP_ADDR:-:8082}
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-http://control-plane:8080}
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
